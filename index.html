<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquiva los Bloques - Juego JS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background-color: #16213e;
            border: 4px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .info {
            margin-top: 15px;
            text-align: center;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
        button:hover {
            background-color: #ff2e63;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="info">
        <p>Usa las flechas <strong>⬅️ Izquierda</strong> y <strong>Derecha ➡️</strong> para moverte</p>
        <button id="restartBtn" onclick="reiniciarJuego()">Jugar de nuevo</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const restartBtn = document.getElementById("restartBtn");

        // Variables del juego
        let puntuacion = 0;
        let juegoTerminado = false;
        let velocidadEnemigos = 3;

        // Jugador
        const jugador = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            ancho: 40,
            alto: 40,
            color: "#00fff5",
            velocidad: 6
        };

        // Controles
        let teclas = {};
        window.addEventListener("keydown", (e) => teclas[e.key] = true);
        window.addEventListener("keyup", (e) => teclas[e.key] = false);

        // Lista de obstáculos
        let obstaculos = [];

        function crearObstaculo() {
            const ancho = Math.random() * (100 - 30) + 30;
            const x = Math.random() * (canvas.width - ancho);
            obstaculos.push({
                x: x,
                y: -30,
                ancho: ancho,
                alto: 25,
                color: "#e94560"
            });
        }

        function actualizar() {
            if (juegoTerminado) return;

            // Mover jugador
            if (teclas["ArrowLeft"] && jugador.x > 0) {
                jugador.x -= jugador.velocidad;
            }
            if (teclas["ArrowRight"] && jugador.x + jugador.ancho < canvas.width) {
                jugador.x += jugador.velocidad;
            }

            // Generar obstáculos aleatoriamente
            if (Math.random() < 0.03) {
                crearObstaculo();
            }

            // Mover obstáculos y detectar colisiones
            for (let i = 0; i < obstaculos.length; i++) {
                let obs = obstaculos[i];
                obs.y += velocidadEnemigos;

                // Colisión (AABB)
                if (
                    jugador.x < obs.x + obs.ancho &&
                    jugador.x + jugador.ancho > obs.x &&
                    jugador.y < obs.y + obs.alto &&
                    jugador.y + jugador.alto > obs.y
                ) {
                    juegoTerminado = true;
                    restartBtn.style.display = "inline-block";
                }

                // Eliminar obstáculos que salen de la pantalla y sumar puntos
                if (obs.y > canvas.height) {
                    obstaculos.splice(i, 1);
                    i--;
                    puntuacion++;
                    // Aumentar dificultad cada 10 puntos
                    if (puntuacion % 10 === 0) {
                        velocidadEnemigos += 0.5;
                    }
                }
            }
        }

        function dibujar() {
            // Limpiar pantalla
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar jugador
            ctx.fillStyle = jugador.color;
            ctx.fillRect(jugador.x, jugador.y, jugador.ancho, jugador.alto);

            // Dibujar obstáculos
            obstaculos.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.ancho, obs.alto);
            });

            // Dibujar puntuación
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.fillText("Puntos: " + puntuacion, 15, 30);

            // Pantalla de Game Over
            if (juegoTerminado) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e94560";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "20px Arial";
                ctx.fillText("Puntuación final: " + puntuacion, canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
            }
        }

        function bucleJuego() {
            actualizar();
            dibujar();
            if (!juegoTerminado) {
                requestAnimationFrame(bucleJuego);
            }
        }

        function reiniciarJuego() {
            puntuacion = 0;
            velocidadEnemigos = 3;
            obstaculos = [];
            jugador.x = canvas.width / 2 - 20;
            juegoTerminado = false;
            restartBtn.style.display = "none";
            bucleJuego();
        }

        // Iniciar el juego
        bucleJuego();
    </script>
</body>
</html>
